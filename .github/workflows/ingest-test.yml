# Workflow TEMPORANEO di prova: esegue ingest e analisi (passo 2) su dati veri
# dai runner GitHub. NON salva né pubblica i dati grezzi. Va rimosso dopo il test.
name: ingest-test

on:
  workflow_dispatch:
  push:
    branches: [claude/focused-davinci-3vldey]
    paths:
      - pipeline/**
      - tests/**
      - config/**
      - requirements.txt
      - .github/workflows/ingest-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test offline
        run: pytest -q

      - name: Check sorgenti
        run: python -m pipeline.ingest check || true

      - name: Backfill
        run: python -m pipeline.ingest backfill

      - name: Daily (subito dopo il backfill deve risultare tutto aggiornato)
        run: python -m pipeline.ingest daily

      - name: Riepilogo dati scaricati
        run: |
          python - <<'PY'
          import json, numpy as np, pandas as pd
          from pathlib import Path
          d = Path("data/raw")
          rep = json.loads((d / "_report.json").read_text())
          print("report daily:", rep["summary"], "richieste:", rep["requests"])
          state = json.loads((d / "_state.json").read_text())["instruments"]
          print(f"{'id':<6} {'src':<6} {'righe':>6} {'da':<10} {'a':<10} {'vol NaN':>7} {'max|r|':>7} {'data max|r|':<10}")
          for p in sorted(d.glob("*.parquet")):
              df = pd.read_parquet(p).set_index("date")
              r = np.log(df["close"]).diff().abs()
              s = state.get(p.stem, {})
              print(f"{p.stem:<6} {s.get('source',''):<6} {len(df):>6} {df.index[0].date()!s:<10} "
                    f"{df.index[-1].date()!s:<10} {int(df['volume'].isna().sum()):>7} "
                    f"{r.max():>7.3f} {r.idxmax().date()!s:<10}")
          PY

      - name: Analisi (feature, regimi, anomalie, backtest volatilità)
        run: python -m pipeline.analyze

      - name: Riepilogo analisi e backtest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          res = Path("results")
          print(f"{'id':<6} {'regime':<11} {'giorni':>6} {'p_turb':>6} {'anom.12m':>8}")
          for p in sorted((res / "analysis").glob("*.json")):
              a = json.loads(p.read_text()); r = a["regime"]
              print(f"{a['id']:<6} {r.get('current',''):<11} {r.get('days_in_state',''):>6} "
                    f"{r.get('probabilities',{}).get('turbolento',0):>6.2f} {a['anomalies']['count_last_365_days']:>8}")
          bt = json.loads((res / "backtest" / "volatility.json").read_text())
          print("\nconfigurazioni provate:", bt["trial"]["n_configurations_tried"], "| holdout dal", bt["config"]["holdout_start"])
          for h in ("h1", "h5"):
              print(f"\n== {h}: differenza QLIKE vs rw (negativa = meglio) [t di Diebold-Mariano] | copertura 90%")
              for tid, r in bt["instruments"].items():
                  m = r[h]["models"]
                  cells = [f"{k}={v['qlike_diff_vs_rw']:+.3f}[{v['dm_vs_rw']:+.1f}]" for k, v in m.items() if k != "rw"]
                  cov = " ".join(f"{k}:{v['coverage_90']:.2f}" for k, v in m.items())
                  print(f"{tid:<6} n={r[h]['n']:<5} " + "  ".join(cells) + " | " + cov)
              print("aggregato:", json.dumps(bt["aggregate"][h]))
          PY
