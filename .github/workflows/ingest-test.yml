# Workflow TEMPORANEO di prova: esegue ingest (e più avanti i modelli) su dati veri
# dai runner GitHub. NON salva né pubblica i dati grezzi. Va rimosso dopo il test.
name: ingest-test

on:
  workflow_dispatch:
  push:
    branches: [claude/focused-davinci-3vldey]
    paths:
      - pipeline/**
      - tests/**
      - config/**
      - requirements.txt
      - .github/workflows/ingest-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test offline
        run: pytest -q

      - name: Check sorgenti
        run: python -m pipeline.ingest check || true

      - name: Backfill
        run: python -m pipeline.ingest backfill

      - name: Daily (subito dopo il backfill deve risultare tutto aggiornato)
        run: python -m pipeline.ingest daily

      - name: Riepilogo dati scaricati
        run: |
          python - <<'PY'
          import json, numpy as np, pandas as pd
          from pathlib import Path
          d = Path("data/raw")
          rep = json.loads((d / "_report.json").read_text())
          print("report daily:", rep["summary"], "richieste:", rep["requests"])
          state = json.loads((d / "_state.json").read_text())["instruments"]
          print(f"{'id':<6} {'src':<6} {'righe':>6} {'da':<10} {'a':<10} {'vol NaN':>7} {'max|r|':>7} {'data max|r|':<10}")
          for p in sorted(d.glob("*.parquet")):
              df = pd.read_parquet(p).set_index("date")
              r = np.log(df["close"]).diff().abs()
              s = state.get(p.stem, {})
              print(f"{p.stem:<6} {s.get('source',''):<6} {len(df):>6} {df.index[0].date()!s:<10} "
                    f"{df.index[-1].date()!s:<10} {int(df['volume'].isna().sum()):>7} "
                    f"{r.max():>7.3f} {r.idxmax().date()!s:<10}")
          PY
