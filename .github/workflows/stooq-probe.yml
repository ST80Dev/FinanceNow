# Workflow TEMPORANEO di diagnostica: verifica se Stooq (e yfinance) rispondono
# dagli IP dei runner GitHub. Va rimosso dopo il test.
name: stooq-probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/stooq_probe.py
      - .github/workflows/stooq-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stooq senza API key
        # Diagnostica: il job non deve fallire se Stooq non risponde, conta il log.
        run: python scripts/stooq_probe.py "^ndx" qqq.us "^spx" nvda.us googl.us || true

      - name: yfinance (fallback)
        run: |
          pip install --quiet yfinance
          python - <<'EOF' || true
          import yfinance as yf
          for s in ["^NDX", "QQQ", "^GSPC", "NVDA", "GOOGL"]:
              try:
                  df = yf.download(s, start="2010-01-01", auto_adjust=True, progress=False)
                  if df.empty:
                      print(f"{s:<6} VUOTO")
                  else:
                      print(f"{s:<6} righe={len(df)} da={df.index.min().date()} a={df.index.max().date()}")
              except Exception as e:
                  print(f"{s:<6} ERRORE {type(e).__name__}: {e}")
          EOF
