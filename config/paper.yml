# Paper trading su Alpaca (conti PAPER, soldi virtuali). Vedi pipeline/paper.py.
#
# Ogni strategia ha un proprio conto Alpaca paper: chiavi nelle variabili d'ambiente
# <secret_prefix>_KEY e <secret_prefix>_SECRET (in produzione: GitHub Secrets, mai nel repo).
# Senza le chiavi la strategia viene saltata (si vedono solo i pesi obiettivo).
#
# Campi comuni:
#   id            identificativo (niente trattini: finisce nei client_order_id)
#   kind          buy_hold | assess_rule | indication
#   secret_prefix prefisso delle variabili d'ambiente con le chiavi del conto
# Solo long, nessuna leva: il lato short e le decisioni di Claude arrivano nei passi successivi.

version: 1

# Repository GitHub: il modulo della pagina Paper apre qui il file della nuova indicazione già compilato.
github_repo: ST80Dev/FinanceNow

# Indici che si possono indicare nelle indicazioni settimanali e strumento comprato per ogni direzione.
# Solo ETF senza leva: PSQ e SH sono inversi 1x (salgono quando Nasdaq 100 / S&P 500 scendono);
# niente SQQQ/TQQQ (leva 3x). Le azioni dell'universo si indicano per nome (al rialzo si compra l'azione).
index_instruments:
  ndx: {rialzo: QQQ, ribasso: PSQ}
  spx: {rialzo: SPY, ribasso: SH}

# Altre azioni indicabili dal pannello senza valutazione notturna ({symbol, name}; nelle indicazioni solo con
# when: sempre). Vuoto: dal 20/11/2026 le principali del Nasdaq sono nell'universo e hanno la valutazione.
extra_stocks: []

# Scostamento minimo (in % del valore del conto) per muovere una posizione: meno rotazione inutile.
min_delta: 0.02

strategies:
  # Benchmark: QQQ tenuto sempre. La strategia da battere.
  - id: bench_qqq
    name: Benchmark QQQ (compra e tieni)
    kind: buy_hold
    symbol: QQQ
    weight: 0.99
    secret_prefix: ALPACA_BENCH

  # Regola semplice sulla valutazione automatica (docs/data/assessment.json):
  # azioni con situazione ammessa e rischio non bloccato, a pari peso con tetto; il resto in liquidità.
  - id: regola_assess
    name: Regola sulla valutazione (azioni calme, rischio non alto)
    kind: assess_rule
    allowed_situations: [norma, tranquillo, ripresa]
    block_risk: [alto]
    max_weight: 0.15
    # Solo i 10 titoli di partenza (universo del 26/10/2026): il confronto con QQQ resta sullo stesso insieme
    # anche dopo l'aggiunta di altre azioni all'universo (20/11/2026).
    only: [nvda, aapl, googl, msft, amzn, meta, avgo, tsla, mu, amd]
    secret_prefix: ALPACA_RULE

  # Indicazioni settimanali di Simone (config/indications/<data>.yml, scritte anche dal modulo della
  # pagina Paper): il conto applica l'indicazione in vigore. Prima indicazione: copertura ribassista con PSQ.
  - id: indicazioni
    name: Indicazioni settimanali (le scelte di Simone)
    kind: indication
    secret_prefix: ALPACA_LOSH
